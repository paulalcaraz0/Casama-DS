<svg xmlns='http://www.w3.org/2000/svg' width='760' height='370' viewBox='0 0 760 370' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif'>
<title>How often each bill jumps: months with a 2%+ price change</title>
